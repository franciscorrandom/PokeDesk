name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify behavior
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Arcanine-macOS
          path: dist/Arcanine-1.0.0-macOS.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Arcanine-macOS
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCANINE_TAG: ${{ github.ref_name }}
        run: gh release create "$ARCANINE_TAG" dist/Arcanine-1.0.0-macOS.zip --verify-tag --title "Arcanine $ARCANINE_TAG" --notes-file docs/RELEASE.md
